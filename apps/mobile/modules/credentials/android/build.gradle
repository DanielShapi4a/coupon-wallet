plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.credentials'
version = '0.1.0'

android {
  namespace "expo.modules.credentials"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Android Credential Manager with Sign in with Google, Google's recommended API (ADR-002, decision 041).
  // react-native-passkeys asks for credentials 1.3.0-alpha01; Gradle resolves both to this stable version.
  implementation "androidx.credentials:credentials:1.5.0"
  implementation "androidx.credentials:credentials-play-services-auth:1.5.0"
  implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
}
