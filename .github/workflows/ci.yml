name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # The server tests run against a real PostgreSQL, like the local Docker Compose one.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cw
          POSTGRES_PASSWORD: cw
          POSTGRES_DB: cw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cw"
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://cw:cw@localhost:5432/cw_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
